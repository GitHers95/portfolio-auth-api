services:
  db:
    image: postgres:15-alpine
    container_name: portfolio-db-prod
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    build: .
    container_name: portfolio-api-prod
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # PAS de volume ! Le code est intégré dans l'image
    # PAS de --reload !
    restart: unless-stopped
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: portfolio-adminer-prod
    ports:
      - "8080:8080"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
