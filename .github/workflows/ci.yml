name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    # Service PostgreSQL lancé en parallèle du job
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Installation de Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Vérification de la syntaxe Python (flake8)
        run: |
          pip install flake8
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Vérification de l'import de l'application
        run: |
          python -c "from app.main import app; print('Import OK')"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          BASIC_AUTH_USERNAME: admin
          BASIC_AUTH_PASSWORD: test
          SECRET_KEY: test_secret_key_for_ci

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Construction de l'image Docker
        run: docker build -t portfolio-auth-api:test .
